<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Curriculum Vitae | Craig M. Nielsen</title>
  <meta name="description" content="Curriculum Vitae of Craig M. Nielsen (PDF).">
  <meta name="author" content="Craig M. Nielsen">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./assets/img/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="./assets/css/style.css">

  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: var(--bg-primary);
    }

    .cv-view-header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.75rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      z-index: 10;
    }

    .cv-view-title {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .cv-view-title h1 {
      font-size: 1.15rem;
      margin: 0;
      font-family: var(--font-serif);
      font-weight: 600;
    }

    .cv-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .pdf-frame-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 60px);
      background-color: #525659;
    }

    .pdf-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    @media (max-width: 600px) {
      .cv-view-header {
        padding: 0.5rem 1rem;
      }
      .cv-view-title h1 {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Action Navigation Bar -->
  <header class="cv-view-header">
    <div class="cv-view-title">
      <a href="./index.html" class="action-badge">
        &larr; Back to Home
      </a>
      <h1>Craig M. Nielsen &mdash; Curriculum Vitae</h1>
    </div>

    <div class="cv-actions">
      <a href="./assets/Craig_Nielsen_CV.pdf" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" style="padding: 0.4rem 0.85rem; font-size: 0.825rem;">
        <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Open in New Tab
      </a>
      <a href="./assets/Craig_Nielsen_CV.pdf" download="Craig_Nielsen_CV.pdf" class="btn btn-primary" style="padding: 0.4rem 0.85rem; font-size: 0.825rem;">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download PDF
      </a>
      <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode" title="Toggle theme">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Full-Page PDF Display Container -->
  <main class="pdf-frame-container">
    <object
      data="./assets/Craig_Nielsen_CV.pdf#toolbar=1&navpanes=0"
      type="application/pdf"
      class="pdf-frame"
    >
      <iframe
        src="./assets/Craig_Nielsen_CV.pdf#toolbar=1"
        class="pdf-frame"
        title="Craig M. Nielsen - Curriculum Vitae"
      >
        <div style="color: #ffffff; padding: 3rem; text-align: center; font-family: var(--font-sans);">
          <p style="font-size: 1.15rem; margin-bottom: 1.25rem;">Your browser does not support inline PDF viewing.</p>
          <a href="./assets/Craig_Nielsen_CV.pdf" class="btn btn-primary" download="Craig_Nielsen_CV.pdf">
            Download Craig Nielsen's CV (PDF)
          </a>
        </div>
      </iframe>
    </object>
  </main>

  <script src="./assets/js/main.js"></script>
</body>
</html>
